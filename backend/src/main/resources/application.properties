spring.application.name=backend

# Data source
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Schema is owned by Flyway; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Keep Flyway's default location explicit.
spring.flyway.locations=classpath:db/migration

# JSON field names are snake_case across the API.
spring.jackson.property-naming-strategy=SNAKE_CASE

# Authentication
proxyma.jwt.secret=${PROXYMA_JWT_SECRET}
proxyma.jwt.issuer=proxyma
proxyma.auth.access-token-ttl=15m
proxyma.auth.admin-access-token-ttl=5m
proxyma.auth.refresh-token-ttl=7d
# A refresh token presented again within this window is treated as a lost race
# between concurrent refreshes rather than as token theft.
proxyma.auth.refresh-reuse-grace=30s
proxyma.auth.cookie.name=proxyma_refresh
proxyma.auth.cookie.path=/api/v1/auth
proxyma.auth.cookie.secure=${PROXYMA_COOKIE_SECURE:true}
proxyma.auth.cookie.same-site=Strict
proxyma.auth.password.min-length=10
proxyma.auth.password.max-length=128
proxyma.auth.argon2.salt-length=16
proxyma.auth.argon2.hash-length=32
proxyma.auth.argon2.parallelism=1
proxyma.auth.argon2.memory-kibibytes=19456
proxyma.auth.argon2.iterations=2
proxyma.auth.rate-limit.register-per-minute=10
proxyma.auth.rate-limit.login-per-minute=10
proxyma.auth.rate-limit.account-login-per-minute=10
proxyma.auth.rate-limit.refresh-per-minute=30

# No browser origins are allowed by default. The dashboard is expected to use a
# same-origin dev proxy; set this for deployments that serve it from elsewhere.
proxyma.cors.allowed-origins=${PROXYMA_CORS_ALLOWED_ORIGINS:}

logging.level.root=INFO
# logging.level.org.springframework=DEBUG
